<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="NEXUS Technology Logo">
  <!-- Icono (Cubo 3D Isométrico) -->
  <g transform="translate(10, 15)">
    <!-- Cara Superior (Verde Turquesa) -->
    <path d="M45,0 L90,26 L45,52 L0,26 Z" fill="#3EB5AC" />
    
    <!-- Cara Izquierda (Azul Real) -->
    <path d="M0,26 L45,52 L45,104 L0,78 Z" fill="#3C6FB5" />
    
    <!-- Cara Derecha (Azul Marino) -->
    <path d="M45,52 L90,26 L90,78 L45,104 Z" fill="#1D3D8E" />

    <!-- Reflejos internos (Gris Plata) -->
    <!-- Línea central vertical -->
    <line x1="45" y1="52" x2="45" y2="104" stroke="#A6A6A6" stroke-width="2" opacity="0.5" />
    <!-- Línea superior izquierda -->
    <line x1="0" y1="26" x2="45" y2="52" stroke="#A6A6A6" stroke-width="2" opacity="0.5" />
    <!-- Línea superior derecha -->
    <line x1="45" y1="52" x2="90" y2="26" stroke="#A6A6A6" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Texto -->
  <g transform="translate(120, 55)">
    <!-- "NEXUS" -->
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="#4D4D4D" letter-spacing="2">NEXUS</text>
    
    <!-- Línea Divisoria (Verde Turquesa) -->
    <line x1="0" y1="15" x2="270" y2="15" stroke="#3EB5AC" stroke-width="3" />

    <!-- "TECHNOLOGY" -->
    <text x="0" y="42" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#A6A6A6" letter-spacing="4">TECHNOLOGY</text>
  </g>
</svg>